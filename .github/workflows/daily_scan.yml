name: Options Scanner Daily Run

on:
  schedule:
    # cron은 항상 UTC 기준으로 실행되고, GitHub 서버 시간은 UTC라 변하지 않습니다.
    # 반면 한국(KST)은 서머타임이 없어서 UTC+9로 항상 고정입니다.
    # 즉 아래 cron("0 13 * * 1-5")은 계절과 상관없이 항상 한국시간 22:00(밤 10시)에 실행됩니다.
    #
    # 다만 "미국 장 개장 몇 분 전"인지는 미국의 서머타임 여부에 따라 달라집니다:
    #   - 서머타임 기간(3월~11월, EDT, UTC-4): UTC 13:00 = 미국 동부 09:00 = 개장(9:30) 30분 전 ✅ 정확히 원하는 타이밍
    #   - 표준시 기간(11월~3월, EST, UTC-5):   UTC 13:00 = 미국 동부 08:00 = 개장(9:30) 1시간 30분 전 (조금 더 이름)
    #
    # 정리: 지금 그대로 두시면 "한국시간 밤 10시 고정"으로 계속 실행됩니다.
    # 만약 "정확히 개장 30분 전"을 1년 내내 칼같이 맞추고 싶으시면,
    # 11월 초(서머타임 종료 시점)에 cron을 "0 14 * * 1-5"로 바꿨다가
    # 3월 중순(서머타임 시작 시점)에 다시 "0 13 * * 1-5"로 되돌리면 됩니다.
    # (그 경우 한국시간은 겨울철에만 22:00 → 23:00으로 한 시간 밀립니다.)
    - cron: "0 13 * * 1-5"   # 평일만 (월~금)
  workflow_dispatch: {}       # 수동 실행 버튼도 추가 (테스트용)

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 히스토리 CSV를 리포지토리에 커밋하기 위해 필요

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install yfinance pandas requests

      - name: 스캐너 실행
        working-directory: scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python unusual_options_scanner.py

      - name: 히스토리/결과 파일 커밋
        run: |
          git config user.name "options-scanner-bot"
          git config user.email "actions@github.com"
          git add scanner/options_volume_history.csv scanner/unusual_options_today.csv
          git diff --staged --quiet || git commit -m "Daily scan results $(date -u +%Y-%m-%d)"
          git push
